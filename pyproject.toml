[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", "venv", ".venv", "migrations", "alembic/versions"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 88
py_version = 312
skip_gitignore = true
skip_glob = ["alembic/versions/*.py"]
