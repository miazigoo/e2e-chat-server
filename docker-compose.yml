services:
  postgres:
    image: postgres:16
    container_name: secure_chat_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  redis:
    image: redis:7-alpine
    container_name: secure_chat_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chat_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: secure_chat_rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  minio:
    image: minio/minio:latest
    container_name: secure_chat_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  minio_init:
    image: minio/mc:latest
    container_name: secure_chat_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET_ASSETS} || true &&
      mc mb -p local/${MINIO_BUCKET_ATTACHMENTS} || true &&
      mc mb -p local/${MINIO_BUCKET_TEMP} || true &&
      mc anonymous set none local/${MINIO_BUCKET_ASSETS} &&
      mc anonymous set none local/${MINIO_BUCKET_ATTACHMENTS} &&
      mc anonymous set none local/${MINIO_BUCKET_TEMP} &&
      exit 0
      "
    networks:
      - chat_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_chat_api
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat_net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_chat_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat_net

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_chat_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=INFO
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  chat_net:
    driver: bridge
